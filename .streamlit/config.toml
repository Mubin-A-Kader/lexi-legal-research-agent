[server]
headless = true
enableCORS = false
enableXsrfProtection = true
# Don't walk site-packages — transformers' vision modules try to import torchvision (unused) and spam errors.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#7c6cff"
backgroundColor = "#0f0c29"
secondaryBackgroundColor = "#1a1a3e"
textColor = "#f3f4ff"
font = "sans serif"
