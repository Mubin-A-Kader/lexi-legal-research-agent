services:
  - type: web
    name: lexi-legal-researcher
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: OPENAI_API_KEY
        sync: false        # set in Render dashboard (secret)
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: ENABLE_RERANKER     # OFF on free tier — avoids torch (512 MB memory limit)
        value: "false"
