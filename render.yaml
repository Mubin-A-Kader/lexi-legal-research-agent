services:
  - type: web
    name: lexi-legal-researcher
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: OPENAI_API_KEY
        sync: false        # set in Render dashboard (secret)
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: ENABLE_RERANKER     # ON: minimal ONNX bi-encoder rerank, no torch — fits 512 MB
        value: "true"
      - key: APP_PASSWORD
        sync: false        # set in Render dashboard (secret)
