services:
  - type: web
    name: lexi-legal-researcher
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: OPENAI_API_KEY
        sync: false        # set in Render dashboard (secret)
      - key: APP_PASSWORD
        sync: false        # shared access key — gates the public URL; unset = open
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: ENABLE_RERANKER     # ON: bi-encoder cosine rerank via OpenAI embeds — no in-process model
        value: "true"
